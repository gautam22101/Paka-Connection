<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pakka Connection Final Logo</title>
  <desc id="desc">Luxury gold circular brand mark with Pakka Connection wordmark on black background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9d76c"/>
      <stop offset="20%" stop-color="#f7d15d"/>
      <stop offset="45%" stop-color="#efbf3a"/>
      <stop offset="70%" stop-color="#d5980d"/>
      <stop offset="100%" stop-color="#f4d86d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#02070f"/>

  <g>
    <circle cx="760" cy="470" r="415" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <path d="M 1195 170 L 1255 235 L 1160 250 Z" fill="url(#gold)"/>
    <path d="M 1170 150 Q 1245 150 1265 225" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <g>
    <text x="280" y="530" font-size="250" font-weight="900" fill="#f3f3f3" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-10">PAKKA</text>
    <text x="280" y="640" font-size="118" font-weight="600" fill="#f3f3f3" font-family="Segoe UI, Arial, sans-serif" letter-spacing="0">CONNECTION</text>
  </g>

  <g>
    <line x1="1070" y1="220" x2="1070" y2="690" stroke="#f4f4f4" stroke-width="8" opacity="0.9"/>
    <text x="1138" y="350" font-size="60" font-weight="400" fill="#f4f4f4" font-family="Segoe UI, Arial, sans-serif">360? SOLUTION</text>
    <text x="1138" y="445" font-size="58" font-weight="400" fill="#f4f4f4" font-family="Segoe UI, Arial, sans-serif">PROVIDER FOR</text>
    <text x="1138" y="545" font-size="58" font-weight="400" fill="#f4f4f4" font-family="Segoe UI, Arial, sans-serif">BRANDS &amp; BUSINESS</text>
  </g>
</svg>
