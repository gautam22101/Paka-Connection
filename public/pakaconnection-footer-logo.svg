<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
  <title id="title">Pakka Connection Footer Logo</title>
  <desc id="desc">Compact Pakka Connection brand mark on dark background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9d76c"/>
      <stop offset="20%" stop-color="#f7d15d"/>
      <stop offset="45%" stop-color="#efbf3a"/>
      <stop offset="70%" stop-color="#d5980d"/>
      <stop offset="100%" stop-color="#f4d86d"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" fill="#02070f"/>
  <g>
    <circle cx="95" cy="110" r="85" fill="none" stroke="url(#gold)" stroke-width="9"/>
    <path d="M 115 45 Q 160 60 180 95" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <path d="M 162 40 L 180 92 L 132 82 Z" fill="url(#gold)"/>
  </g>
  <g>
    <text x="225" y="120" font-size="82" font-weight="900" fill="#f3f3f3" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-5">PAKKA</text>
    <text x="225" y="170" font-size="33" font-weight="600" fill="#f3f3f3" font-family="Segoe UI, Arial, sans-serif" letter-spacing="1">CONNECTION</text>
  </g>
</svg>
