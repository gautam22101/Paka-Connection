<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Pakaconnection Footer Logo</title>
  <desc id="desc">Compact Pakaconnection wordmark for dark footer use.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd75b"/>
      <stop offset="18%" stop-color="#f7d35d"/>
      <stop offset="42%" stop-color="#f2b92a"/>
      <stop offset="68%" stop-color="#d89f0d"/>
      <stop offset="100%" stop-color="#f7d45b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#030d1a"/>

  <g transform="translate(18, 26)" filter="url(#softGlow)">
    <circle cx="84" cy="84" r="76" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <path d="M138 28 A76 76 0 1 1 126 156" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
    <path d="M127 31 L128 67 L167 49 Z" fill="url(#gold)"/>
  </g>

  <g transform="translate(210, 32)">
    <text x="0" y="58" font-size="70" font-weight="900" fill="#f5f5f5" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-3">PAKKA</text>
    <text x="3" y="112" font-size="26" font-weight="600" fill="#f5f5f5" font-family="Segoe UI, Arial, sans-serif" letter-spacing="3.2">CONNECTION</text>
  </g>
</svg>
